<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>niri-style desktop</title>
<style>
:root{--accent:#7aa2f7;--accent2:#bb9af7;--on:#fff;--radius:12px;--bw:3px;--gap:14px;--fs:14px;--font:system-ui,sans-serif;--dur:.28s;--ease:cubic-bezier(.34,1.3,.64,1);--wp:96%;--top:0px;--bot:0px;
--bg:#14151f;--fg:#d5d8e6;--sf:#1d1f2c;--sf2:#2a2c3d;--bd:#ffffff1f;--inact:#3a3d52;--shadow:0 10px 30px #0009;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root.light{--bg:#e6e9f3;--fg:#1d2030;--sf:#fbfbfe;--sf2:#e8eaf4;--bd:#00000022;--inact:#b4b9d0;--shadow:0 8px 24px #0004}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);font:var(--fs)/1.4 var(--font);color:var(--fg);user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#bar{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);height:34px;z-index:50;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--sf);box-shadow:inset 0 0 0 1px var(--bd)}
.fl #bar{left:8px;right:8px;margin-top:6px;border-radius:var(--radius)}
.bb #bar{top:auto;bottom:env(safe-area-inset-bottom,0px)}
.fl.bb #bar{margin-top:0;margin-bottom:6px}
.bh #bar{display:none}
#bar button{border:0;background:none;cursor:pointer;padding:3px 8px;border-radius:8px}
#bar button:hover{background:var(--sf2)}
#wsd{display:flex;gap:6px}
#wsd i{width:10px;height:10px;border-radius:50%;background:var(--inact);cursor:pointer;opacity:.6}
#wsd i.has{opacity:1}
#wsd i.on{background:var(--accent);width:22px;border-radius:6px;opacity:1}
#ttl{flex:1;text-align:center;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tray{opacity:.8;white-space:nowrap}
#stage{position:absolute;left:0;right:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:calc(var(--bot) + env(safe-area-inset-bottom,0px));overflow:hidden}
#wsw{position:absolute;inset:0;transition:transform var(--dur) var(--ease)}
.ov #wsw{transform:scale(.5)}
.ws{position:absolute;inset:0;transition:transform var(--dur) var(--ease),opacity var(--dur)}
.ov .ws{outline:2px solid var(--bd);border-radius:20px;background:#0003}
.strip{position:absolute;left:0;top:0;bottom:0;display:flex;gap:var(--gap);padding:var(--gap) 0;box-sizing:border-box;transition:transform var(--dur) var(--ease)}
.col{flex:none;display:flex;flex-direction:column;gap:var(--gap);position:relative;transition:width var(--dur) var(--ease)}
.drag *{transition:none!important}
.rz{position:absolute;top:0;bottom:0;right:-10px;width:10px;cursor:ew-resize;z-index:5}
.win{flex:1;min-height:0;display:flex;padding:var(--bw);border-radius:calc(var(--radius) + var(--bw));background:var(--inact);transition:background .2s}
.win.f{background:var(--accent)}
.grad .win.f{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.sh .win{box-shadow:var(--shadow)}
.wb{flex:1;min-width:0;display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;background:color-mix(in srgb,var(--sf) var(--wp),transparent)}
.tb{flex:none;height:28px;display:flex;align-items:center;padding:0 6px 0 12px;background:var(--sf2);font-size:.9em}
.tb b{margin-left:auto;display:flex}
.tb button{border:0;background:none;cursor:pointer;width:24px;height:22px;border-radius:6px;opacity:.7}
.tb button:hover{background:var(--bd);opacity:1}
.ct{flex:1;min-height:0;overflow:auto;user-select:text}
.term{padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.term .o{white-space:pre-wrap;word-break:break-word}
.term .ln{display:flex;gap:8px}.term .ps{color:var(--accent);white-space:nowrap}
.term input{flex:1;min-width:0;background:none;border:0;outline:0;font-family:inherit}
.notes{display:block;width:100%;height:100%;box-sizing:border-box;border:0;resize:none;padding:12px;background:none;outline:0}
.fm{display:flex;height:100%}
.fm .nav{width:110px}
.set{display:flex;height:100%}
.nav{width:128px;flex:none;background:var(--sf2);padding:8px;overflow:auto;box-sizing:border-box}
.nav button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;border-radius:8px;cursor:pointer}
.nav button.on{background:var(--accent);color:var(--on)}
.pn{flex:1;min-width:0;padding:6px 16px 16px;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row label{flex:1}
.row .c{display:flex;align-items:center;gap:8px}
.row .o{min-width:44px;text-align:right;opacity:.7;font-variant-numeric:tabular-nums}
.pn input[type=range]{accent-color:var(--accent);width:140px}
.pn input[type=color]{width:44px;height:28px;border:0;padding:0;background:none;cursor:pointer}
.pn select,.pn input[type=text]{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
.tg{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--inact);position:relative;cursor:pointer;transition:background .2s;margin:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tg:checked{background:var(--accent)}.tg:checked::after{transform:translateX(16px)}
.sws{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sws button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sws button.on{outline:2px solid var(--fg);outline-offset:2px}
.btn{border:1px solid var(--bd);background:var(--sf2);padding:6px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.kb{width:100%;border-collapse:collapse}.kb td{padding:6px 0;border-bottom:1px solid var(--bd)}.kb td:first-child{font-family:ui-monospace,monospace;color:var(--accent)}
h3{margin:14px 0 4px;font-size:1.1em}
.fl2 button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer}
.fl2 button.on{background:var(--sf2)}
#launch{position:fixed;inset:0;display:none;place-items:start center;padding-top:14vh;background:#0006;z-index:100}
.lb{width:min(440px,92vw);background:var(--sf);border-radius:calc(var(--radius) + 2px);border:2px solid var(--accent);overflow:hidden;box-shadow:var(--shadow)}
.lb input{width:100%;box-sizing:border-box;border:0;outline:0;background:none;padding:14px 16px;font-size:1.15em;border-bottom:1px solid var(--bd)}
.lb div{padding:9px 16px;cursor:pointer}.lb div.sel{background:var(--accent);color:var(--on)}
#night{position:fixed;inset:0;pointer-events:none;z-index:200;mix-blend-mode:multiply;display:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--sf);padding:8px 14px;border-radius:20px;box-shadow:var(--shadow);z-index:90;transition:opacity .6s;font-size:.9em;max-width:92vw;text-align:center}
@media(prefers-reduced-motion:reduce){:root{--dur:0s!important}}
</style></head><body>
<div id="bar"><button id="lb" title="Launcher">Apps</button><div id="wsd"></div><div id="ttl"></div><span id="tray"></span><button id="ovb" title="Overview">Overview</button><span id="clk"></span></div>
<div id="stage"><div id="wsw"></div></div>
<div id="launch"><div class="lb"><input id="li" placeholder="Run an app…" autocomplete="off" spellcheck="false"><div id="ll" style="padding:0"></div></div></div>
<div id="night"></div><div id="hint"></div>
<script>

const PRE=[['Blue','#7aa2f7','#bb9af7'],['Rose','#f7768e','#ff9e64'],['Mint','#2dd4bf','#86efac'],['Amber','#f5a623','#f7768e'],['Violet','#a78bfa','#f472b6'],['Lime','#a3e635','#22d3ee'],['Coral','#ff6b5a','#ffb86b'],['Slate','#94a3b8','#64748b']];

Midnight:()=>'linear-gradient(160deg,#0d0e1f,#1b1a3a 60%,#2b1d3f)',Dunes:()=>'linear-gradient(170deg,#f2c48d,#d9835b 55%,#6a3b4f)',Forest:()=>'linear-gradient(160deg,#0f2a22,#1d4a3a 60%,#6b8f71)',
Grid:()=>'linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/32px 32px,var(--bg)',Solid:()=>'var(--bg)'};

const G={
Appearance:[['sw'],['accent','color','Accent color'],['accent2','color','Secondary accent'],['ring','sel','Focus ring',['Solid','Gradient']],['theme','sel','Theme',['Auto','Dark','Light']],['wall','sel','Wallpaper',Object.keys(W)],['radius','rng','Corner radius',0,28,'px'],['bw','rng','Ring width',0,8,'px'],['gap','rng','Window gaps',0,40,'px'],['wop','rng','Window opacity',60,100,'%'],['shadow','tg','Window shadows'],['font','sel','Interface font',Object.keys(FONTS)],['fs','rng','Font size',11,18,'px']],

System:[['vol','rng','Volume',0,100,'%'],['mute','tg','Mute'],['wifi','tg','Wi‑Fi'],['host','txt','Hostname'],['prof','sel','Power profile',['Saver','Balanced','Performance']],['idle','rng','Idle timeout',30,1800,'s'],['lock','tg','Lock on idle']]};
const KB=[['Return','Open terminal'],['D / Space','App launcher'],['Q','Close window'],['← → or H L','Focus column'],['↑ ↓ or K J','Focus window in column'],['Shift + ← →','Move column'],['Shift + ↑ ↓','Move window in column'],['PageUp / PageDown','Switch workspace'],['Shift + PageUp / Down','Move column to workspace'],['1 – 4','Go to workspace'],['[ and ]','Consume or expel window'],['R','Cycle column width'],['– and =','Shrink or grow column'],['F','Maximize column'],['C','Center column'],['O','Overview']];

/* ---------- apply settings ---------- */
function apply(){
 const R=document.documentElement,st=R.style,B=document.body.classList;
 const dark=S.theme==='Dark'||(S.theme==='Auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
 R.classList.toggle('light',!dark);
 const n=parseInt(S.accent.slice(1),16),lum=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255;
 st.setProperty('--accent',S.accent);st.setProperty('--accent2',S.accent2);st.setProperty('--on',lum>.62?'#111':'#fff');
 st.setProperty('--radius',S.radius+'px');st.setProperty('--bw',S.bw+'px');st.setProperty('--gap',S.gap+'px');st.setProperty('--fs',S.fs+'px');
 st.setProperty('--font',FONTS[S.font]);st.setProperty('--wp',S.wop+'%');
 st.setProperty('--dur',S.anim?(.28*100/S.speed).toFixed(3)+'s':'0s');
 st.setProperty('--ease',{Spring:'cubic-bezier(.34,1.3,.64,1)',Ease:'cubic-bezier(.4,0,.2,1)',Linear:'linear'}[S.curve]);
 document.body.style.background=W[S.wall]();
 B.toggle('grad',S.ring==='Gradient');B.toggle('sh',S.shadow);B.toggle('fl',S.barStyle==='Floating');B.toggle('bb',S.bar==='Bottom');B.toggle('bh',S.bar==='Hidden');
 const bh=S.bar==='Hidden'?0:S.barStyle==='Floating'?46:34;
 st.setProperty('--top',S.bar==='Top'?bh+'px':'0px');st.setProperty('--bot',S.bar==='Bottom'?bh+'px':'0px');
 const t=(S.temp-2500)/4000,nl=$('#night');nl.style.display=S.night?'block':'none';nl.style.background=`rgb(255,${Math.round(150+105*t)},${Math.round(60+195*t)})`;
 $('#wsd').style.display=S.showWs?'flex':'none';
 tick();layout();
}
function set(k,v){S[k]=v;save();apply();sync()}
function sync(){
 document.querySelectorAll('[data-k]').forEach(i=>{const v=S[i.dataset.k];if(i.type==='checkbox')i.checked=v;else if(i.value!=v)i.value=v;const o=i.nextElementSibling;if(o&&o.className==='o')o.textContent=v+(i.dataset.u||'')});
 document.querySelectorAll('[data-sw]').forEach(b=>b.classList.toggle('on',b.dataset.sw===S.accent));
 document.querySelectorAll('.json').forEach(t=>t.value=JSON.stringify(S,null,2));
}
document.addEventListener('input',e=>{const i=e.target,k=i.dataset&&i.dataset.k;if(k)set(k,i.type==='checkbox'?i.checked:i.type==='range'?+i.value:i.value)});

/* ---------- window model ---------- */
const ws=[0,1,2,3].map(()=>({cols:[],fc:0,off:0}));let cur=0,ov=false,nid=1;
ws.forEach(w=>{w.el=document.createElement('div');w.el.className='ws';w.strip=document.createElement('div');w.strip.className='strip';w.el.append(w.strip);$('#wsw').append(w.el)});
const pad=()=>S.gap+S.strut,V=()=>$('#stage').clientWidth;
const cwid=c=>Math.max(260,Math.round(c.p*(V()-2*pad()+S.gap)-S.gap));
const DP=()=>innerWidth<800?1:{'1/3':1/3,'1/2':.5,'2/3':2/3,Full:1}[S.defw];
const loc=w=>{for(let i=0;i<4;i++){const ci=ws[i].cols.findIndex(c=>c.wins.includes(w));if(ci>=0)return[i,ws[i].cols[ci],ci]}};
const fwin=()=>{const W=ws[cur],c=W.cols[W.fc];return c&&c.wins[c.fw]};
function place(p,kids,o=0){kids.forEach((k,j)=>{if(p.children[j+o]!==k)p.insertBefore(k,p.children[j+o]||null)})}
function geo(W){let x=pad();return W.cols.map(c=>{const wd=cwid(c),l=x;x+=wd+S.gap;return[l,wd]})}

function layout(){
 const v=V();
 ws.forEach((W,i)=>{
  W.el.style.transform=`translateY(calc(${i-cur}*(100% + ${ov?50:0}px)))`;
  W.el.style.opacity=ov||i===cur?1:0;W.el.style.pointerEvents=ov||i===cur?'auto':'none';
  const g=geo(W);W.cols.forEach((c,j)=>{c.el.style.width=g[j][0]!==undefined?g[j][1]+'px':''});
  place(W.strip,W.cols.map(c=>c.el));W.cols.forEach(c=>place(c.el,c.wins.map(w=>w.el),1));
  let o=W.off;
  if(W.cols.length){const[L,wd]=g[Math.min(W.fc,g.length-1)],m=pad();
   if(S.center==='Always')o=v/2-(L+wd/2);
   else if(L+o<m||L+wd+o>v-m)o=S.center==='On overflow'?v/2-(L+wd/2):(L+o<m?m-L:v-m-(L+wd))}else o=0;
  W.off=o;W.strip.style.transform=`translateX(${o}px)`;
  W.cols.forEach((c,ci)=>c.wins.forEach((w,wi)=>w.el.classList.toggle('f',i===cur&&ci===W.fc&&wi===c.fw)));
 });
 $('#stage').classList.toggle('ov',ov);
 $('#wsd').innerHTML=ws.map((W,i)=>`<i data-w="${i}" class="${i===cur?'on ':''}${W.cols.length?'has':''}"></i>`).join('');
 const f=fwin();$('#ttl').textContent=f?APPS[f.app].n:'';
}
function mk(app){
 const w={id:nid++,app},a=APPS[app],el=document.createElement('div');el.className='win';
 el.innerHTML=`<div class="wb"><div class="tb"><span>${a.n}</span><b><button data-a="max" title="Maximize column" aria-label="Maximize">▢</button><button data-a="x" title="Close" aria-label="Close">✕</button></b></div><div class="ct"></div></div>`;
 w.el=el;a.b($('.ct',el),w);
 el.addEventListener('pointerdown',()=>{if(fwin()!==w||ov)fw(w)},true);
 el.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.dataset.a==='x')close(w);else{const c=loc(w)[1];c.p===1?c.p=c.pp||.5:(c.pp=c.p,c.p=1);layout()}});
 el.addEventListener('mouseenter',()=>{if(S.ffm&&!ov&&fwin()!==w)fw(w)});
 return w}
function rz(col){$('.rz',col.el).addEventListener('pointerdown',e=>{e.preventDefault();const x0=e.clientX,w0=cwid(col),st=$('#stage');st.classList.add('drag');
  const mv=ev=>{col.p=Math.min(1,Math.max(.15,(w0+ev.clientX-x0+S.gap)/(V()-2*pad()+S.gap)));layout()};
  const up=()=>{st.classList.remove('drag');removeEventListener('pointermove',mv);removeEventListener('pointerup',up)};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
}
function open(app){
 if(app==='set'){const x=ws.flatMap(W=>W.cols.flatMap(c=>c.wins)).find(w=>w.app==='set');if(x)return fw(x)}
 const W=ws[cur],w=mk(app),el=document.createElement('div');el.className='col';el.innerHTML='<i class="rz"></i>';el.append(w.el);
 const col={p:DP(),wins:[w],fw:0,el},idx=W.cols.length?W.fc+1:0;W.cols.splice(idx,0,col);
 if(S.focusNew||W.cols.length===1)W.fc=idx;ov=false;layout();
 const inp=$('input,textarea',w.el);if(inp&&S.focusNew)setTimeout(()=>inp.focus(),30);
 rz(col);
}
function fw(w){const[i,c,ci]=loc(w);cur=i;ws[i].fc=ci;c.fw=c.wins.indexOf(w);ov=false;layout()}
function close(w){const[i,c,ci]=loc(w),W=ws[i];w.el.remove();c.wins.splice(c.wins.indexOf(w),1);c.fw=Math.min(c.fw,c.wins.length-1);
 if(!c.wins.length){c.el.remove();W.cols.splice(ci,1);W.fc=Math.max(0,Math.min(W.fc-(ci<W.fc?1:0),W.cols.length-1))}layout()}
const goWs=n=>{cur=Math.max(0,Math.min(3,n));layout()};
function focusCol(d){const W=ws[cur];W.fc=Math.max(0,Math.min(W.cols.length-1,W.fc+d));layout()}
function vert(d){const W=ws[cur],c=W.cols[W.fc];c.fw=Math.max(0,Math.min(c.wins.length-1,c.fw+d));layout()}
function moveCol(d){const W=ws[cur],j=W.fc+d;if(j<0||j>=W.cols.length)return;[W.cols[W.fc],W.cols[j]]=[W.cols[j],W.cols[W.fc]];W.fc=j;layout()}
function moveWin(d){const c=ws[cur].cols[ws[cur].fc],j=c.fw+d;if(j<0||j>=c.wins.length)return;[c.wins[c.fw],c.wins[j]]=[c.wins[j],c.wins[c.fw]];c.fw=j;layout()}
function moveWs(d){const t=cur+d;if(t<0||t>3||!ws[cur].cols.length)return;const W=ws[cur],c=W.cols.splice(W.fc,1)[0];W.fc=Math.max(0,Math.min(W.fc,W.cols.length-1));
 const T=ws[t],idx=T.cols.length?T.fc+1:0;T.cols.splice(idx,0,c);T.fc=idx;cur=t;layout()}
function consume(d){const W=ws[cur],c=W.cols[W.fc];
 if(c.wins.length>1){const w=c.wins.splice(c.fw,1)[0];c.fw=Math.min(c.fw,c.wins.length-1);const el=document.createElement('div');el.className='col';el.innerHTML='<i class="rz"></i>';
  const n={p:c.p,wins:[w],fw:0,el},idx=W.fc+(d>0?1:0);W.cols.splice(idx,0,n);W.fc=idx;
  rz(n);}
 else{const nb=W.cols[W.fc+d];if(!nb)return;const w=c.wins[0];c.el.remove();W.cols.splice(W.fc,1);if(d<0){nb.wins.push(w);nb.fw=nb.wins.length-1;W.fc--}else{nb.wins.unshift(w);nb.fw=0}}
 layout()}
function cyc(){const c=ws[cur].cols[ws[cur].fc],P=[1/3,.5,2/3,1];c.p=P.find(p=>p>c.p+.01)||P[0];layout()}

/* ---------- apps ---------- */
const CMD={help:()=>'help  neofetch  accent #hex  gap N  theme dark|light  date  whoami  echo  clear  niri msg workspaces',
whoami:()=>'user',date:()=>new Date().toString(),
neofetch:()=>`user@${S.host}\n-----------\nOS      niri-os (scrolling)\nShell   fish 3.7\nTheme   ${S.theme}\nAccent  ${S.accent}\nGap     ${S.gap}px\nDisplay ${S.res} @ ${S.hz}Hz`,
'niri msg workspaces':()=>ws.map((W,i)=>`${i===cur?'*':' '} ${i+1}: ${W.cols.length} column(s)`).join('\n')};
function buildTerm(el){
 el.classList.add('term');el.innerHTML='<div class="o">Type “help” to list commands. Try: accent #ff6b5a</div><div class="ln"><span class="ps"></span><input spellcheck="false" autocomplete="off" aria-label="Terminal input"></div>';
 const o=$('.o',el),i=$('input',el),ps=$('.ps',el),P=()=>`user@${S.host}:~$`;ps.textContent=P();
 i.addEventListener('keydown',e=>{e.stopPropagation();if(e.key!=='Enter')return;const c=i.value.trim(),[a,b]=c.split(/\s+/);let r='';
  if(c==='clear'){o.textContent='';i.value='';return}
  if(a==='echo')r=c.slice(5);else if(a==='accent'&&/^#[0-9a-f]{6}$/i.test(b||'')){set('accent',b.toLowerCase());r='accent set'}
  else if(a==='gap'&&!isNaN(b)){set('gap',Math.max(0,Math.min(40,+b)));r='gap set'}
  else if(a==='theme'&&/^(dark|light)$/.test(b||'')){set('theme',b[0].toUpperCase()+b.slice(1));r='theme set'}
  else if(CMD[c])r=CMD[c]();else if(c)r=a+': command not found';
  o.textContent+=`\n${P()} ${c}${r?'\n'+r:''}`;i.value='';ps.textContent=P();el.scrollTop=el.scrollHeight});
 el.addEventListener('click',()=>{if(!getSelection().toString())i.focus()})}
function buildNotes(el){const t=document.createElement('textarea');t.className='notes';t.spellcheck=false;
 t.value=`Welcome to your scrolling desktop.\n\nWindows live on an endless strip. Opening one adds a column to the right of the focused one, and the view scrolls to follow.\n\n• ${S.mod}+Return opens a terminal\n• ${S.mod}+←/→ moves focus between columns\n• ${S.mod}+O shows every workspace\n• Drag the right edge of a column to resize it\n\nOpen Settings from the launcher to change the accent color, gaps, bar, and more.`;
 t.addEventListener('keydown',e=>{if(!e.altKey&&!e.ctrlKey&&!e.metaKey)e.stopPropagation()});el.append(t)}
const FS={Home:['Documents/','Downloads/','Pictures/','.config/','notes.txt'],Documents:['thesis.pdf','budget.ods','todo.md'],Downloads:['installer.iso','wallpaper.png'],Pictures:['beach.jpg','screenshot-01.png','family.jpg']};
function buildFiles(el){
 el.innerHTML='<div class="fm"><div class="nav fl2"></div><div class="pn fl2"></div></div>';const n=$('.nav',el),p=$('.pn',el);let sel='';
 const show=k=>{n.innerHTML=Object.keys(FS).map(x=>`<button data-f="${x}" class="${x===k?'on':''}">${x}</button>`).join('');p.innerHTML=FS[k].map(x=>`<button>${x}</button>`).join('')};
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.f)show(b.dataset.f);else{p.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}});show('Home')}
function buildSet(el){
 const names=[...Object.keys(G),'Keybinds','About'];
 el.innerHTML=`<div class="set"><div class="nav">${names.map(n=>`<button>${n}</button>`).join('')}</div><div class="pn"></div></div>`;
 const pn=$('.pn',el),nav=$('.nav',el);
 const row=r=>{const[k,t,l,a,b,u]=r;if(t===undefined)return`<div class="row"><label>Accent presets</label><div class="sws">${PRE.map(p=>`<button data-sw="${p[1]}" data-a2="${p[2]}" title="${p[0]}" aria-label="${p[0]}" style="background:linear-gradient(135deg,${p[1]},${p[2]})"></button>`).join('')}</div></div>`;
  const c=t==='color'?`<input type="color" data-k="${k}" value="${S[k]}">`:t==='tg'?`<input type="checkbox" class="tg" data-k="${k}" ${S[k]?'checked':''}>`:
  t==='rng'?`<input type="range" data-k="${k}" data-u="${u}" min="${a}" max="${b}" value="${S[k]}"><span class="o">${S[k]}${u}</span>`:
  t==='txt'?`<input type="text" data-k="${k}" value="${S[k]}">`:`<select data-k="${k}">${a.map(x=>`<option ${x==S[k]?'selected':''}>${x}</option>`).join('')}</select>`;
  return`<div class="row"><label>${l}</label><div class="c">${c}</div></div>`};
 const show=n=>{[...nav.children].forEach(b=>b.classList.toggle('on',b.textContent===n));
  pn.innerHTML=n==='Keybinds'?`<h3>Keybinds</h3><p style="opacity:.7">Mod is currently <b>${S.mod}</b>. Change it under Input.</p><table class="kb">${KB.map(k=>`<tr><td>${S.mod} + ${k[0]}</td><td>${k[1]}</td></tr>`).join('')}</table>`:
  n==='About'?`<h3>niri-os</h3><p style="opacity:.8">A scrolling tiling desktop prototype. Settings save in this browser.</p><div class="row"><label>Settings as JSON</label><button class="btn" data-x="copy">Copy</button></div><textarea class="json notes" style="height:160px;font-family:ui-monospace,monospace;font-size:.85em;background:var(--sf2);border-radius:8px" readonly></textarea><div class="row"><label>Restore every setting</label><button class="btn" data-x="reset">Reset to defaults</button></div>`:
  `<h3>${n}</h3>${G[n].map(row).join('')}`;sync()};
 nav.addEventListener('click',e=>{if(e.target.matches('button'))show(e.target.textContent)});
 pn.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.sw){S.accent=b.dataset.sw;S.accent2=b.dataset.a2;save();apply();sync()}
  if(b.dataset.x==='reset'){S={...D};save();apply();sync()}
  if(b.dataset.x==='copy'){const t=$('.json',pn);t.select();try{navigator.clipboard.writeText(t.value);b.textContent='Copied'}catch(x){b.textContent='Press Ctrl+C'}}});
 pn.addEventListener('keydown',e=>e.stopPropagation());show('Appearance')}
const APPS={term:{n:'Terminal',b:buildTerm},files:{n:'Files',b:buildFiles},notes:{n:'Notes',b:buildNotes},set:{n:'Settings',b:buildSet}};

/* ---------- launcher, bar, keys ---------- */
let li=0,items=[];const L=$('#launch'),LI=$('#li');
function fill(){const q=LI.value.toLowerCase();items=Object.keys(APPS).filter(k=>APPS[k].n.toLowerCase().includes(q));li=Math.min(li,Math.max(0,items.length-1));$('#ll').innerHTML=items.map((k,j)=>`<div data-k="${k}" class="${j===li?'sel':''}">${APPS[k].n}</div>`).join('')||'<div>No matching app</div>'}
function launcher(on){L.style.display=on?'grid':'none';if(on){LI.value='';li=0;fill();LI.focus()}}
LI.addEventListener('input',e=>{e.stopPropagation();li=0;fill()});
LI.addEventListener('keydown',e=>{if(e.key==='Escape')launcher(0);else if(e.key==='Enter'&&items[li]){launcher(0);open(items[li])}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();li=(li+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;fill()}});
L.addEventListener('mousedown',e=>{const d=e.target.closest('[data-k]');if(d&&e.target.closest('#ll')){launcher(0);open(d.dataset.k)}else if(e.target===L)launcher(0)});
$('#lb').onclick=()=>launcher(1);$('#ovb').onclick=()=>{ov=!ov;layout()};
$('#wsd').addEventListener('click',e=>{if(e.target.dataset.w)goWs(+e.target.dataset.w)});
function tick(){const d=new Date();$('#clk').textContent=d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})+'  '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:S.secs?'2-digit':undefined,hour12:!S.clock24});
 $('#tray').textContent=`${S.wifi?'Wi‑Fi':'Offline'}   Vol ${S.mute?'muted':S.vol+'%'}   Bat 87%`}
setInterval(tick,1000);
addEventListener('resize',layout);
let wt=0;$('#stage').addEventListener('wheel',e=>{if(!(Math.abs(e.deltaX)>Math.abs(e.deltaY)||e.shiftKey)||Date.now()-wt<180)return;wt=Date.now();const d=(e.deltaX||e.deltaY)>0?1:-1;focusCol(S.nat?d:-d)},{passive:true});
addEventListener('keydown',e=>{
 if(L.style.display==='grid')return;
 if(!(S.mod==='Alt'?e.altKey:S.mod==='Ctrl'?e.ctrlKey:e.metaKey))return;
 const c=e.code,s=e.shiftKey,W=ws[cur],col=W.cols[W.fc];let h=1;
 if(c==='Enter')open('term');else if(c==='KeyD'||c==='Space')launcher(1);else if(c==='KeyO'){ov=!ov;layout()}
 else if(/^Digit[1-4]$/.test(c)){const n=+c[5]-1;s?moveWs(n-cur):goWs(n)}
 else if(c==='PageUp'||c==='PageDown'){const d=c==='PageUp'?-1:1;s?moveWs(d):goWs(cur+d)}
 else if(col){const d=c==='ArrowLeft'||c==='KeyH'?-1:c==='ArrowRight'||c==='KeyL'?1:0,v=c==='ArrowUp'||c==='KeyK'?-1:c==='ArrowDown'||c==='KeyJ'?1:0;
  if(d)s?moveCol(d):focusCol(d);else if(v)s?moveWin(v):vert(v);
  else if(c==='KeyQ')close(col.wins[col.fw]);else if(c==='BracketLeft')consume(-1);else if(c==='BracketRight')consume(1);
  else if(c==='KeyR')cyc();else if(c==='KeyF'){col.p===1?col.p=col.pp||.5:(col.pp=col.p,col.p=1);layout()}
  else if(c==='KeyC'){const g=geo(W)[W.fc];W.off=V()/2-(g[0]+g[1]/2);layout()}
  else if(c==='Minus'||c==='Equal'){col.p=Math.min(1,Math.max(.15,col.p+(c==='Equal'?.1:-.1)));layout()}else h=0}
 else h=0;
 if(h)e.preventDefault()});

/* ---------- boot ---------- */
apply();open('term');open('notes');open('files');
{const W=ws[cur],c=W.cols[2];/* stack Files under Notes */const f=c.wins[0];c.el.remove();W.cols.splice(2,1);W.cols[1].wins.push(f);}
open('set');ws[0].fc=0;layout();
{const h=$('#hint');h.textContent=`Tip: ${S.mod}+←/→ moves between columns, ${S.mod}+O shows the overview, ${S.mod}+D opens apps.`;setTimeout(()=>h.style.opacity=0,7000);setTimeout(()=>h.remove(),8000)}
</script></body></html>
